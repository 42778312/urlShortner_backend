services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: link-shortener-backend
    container_name: link-shortener-backend
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PORT: 3000
      DATABASE_PATH: ${DATABASE_PATH:-data/database.sqlite}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      SHORT_CODE_LENGTH: ${SHORT_CODE_LENGTH:-6}
    volumes:
      - sqlite-data:/app/data

volumes:
  sqlite-data:
    driver: local
